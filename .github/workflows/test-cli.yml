name: Test for CLI tools

permissions:
  contents: read

on:
  push:
    branches: [main, "support-*"]

jobs:
  build:
    runs-on: windows-latest
    env:
      USI_ENGINE_JSON: AppData\Roaming\electron-shogi\usi_engine.json
    steps:
      # Setup
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: "npm"
      - run: npm install -g npm@latest
      - run: npm version
      - run: npm ci --no-audit --no-fund
      - run: npm -g i tsx

      # usi-csa-bridge
      # runner コンテキストは jobs.<job_id>.env では利用できないため、
      # ここで GITHUB_ENV に書き出してから後続ステップで参照する。
      - name: Set USI_CSA_BRIDGE_TMP
        run: echo "USI_CSA_BRIDGE_TMP=${{ runner.temp }}\usi-csa-bridge" >> $env:GITHUB_ENV
        shell: pwsh
      - run: npm run usi-csa-bridge:build
      - run: Move-Item -Path dist\command\usi-csa-bridge -Destination $env:USI_CSA_BRIDGE_TMP
        shell: pwsh
      - name: Install dependencies for usi-csa-bridge
        run: |
          cd $env:USI_CSA_BRIDGE_TMP
          npm i --no-audit --no-fund
        shell: pwsh
      - name: Test usi-csa-bridge
        timeout-minutes: 1
        # $env:VAR の直後にパスを連結すると PowerShell の構文エラーになるため文字列展開し、
        # シバン行(#!/bin/bash)を解釈できるよう bash 経由で実行する。
        run: bash "$env:USI_CSA_BRIDGE_TMP\e2e\run-all"
        shell: pwsh
