name: Audit

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * 2,6" # Every Tuesday and Saturday at 09:00 JST
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v7.1.0
        with:
          # Pin to the same Node.js version as the Test workflow so the
          # audit results do not change when a new LTS line is released.
          # Do not use Node.js v24.16.0 or later
          # See: https://github.com/electron/electron/issues/51619
          node-version: v24.15.0
          cache: "npm"
      - run: npm install -g npm@latest
      - run: npm version
      - run: npm ci --dry-run --prefer-online
      - run: npm audit --audit-level critical
